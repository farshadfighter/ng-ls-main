# Standalone License Server stack: Postgres + Redis + API + admin UI.
#
# Configuration comes from a root .env (see .env.example) and is passed to the
# containers as real environment variables. Nothing is read from a .env baked
# into an image — that file is .dockerignore'd precisely so secrets stay out of
# the image layers.
#
#   cp .env.example .env  &&  edit  &&  docker compose up -d --build

services:
  postgres:
    image: postgres:18-alpine
    container_name: ng-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    volumes:
      # postgres:18 sets PGDATA to /var/lib/postgresql/18/docker and declares
      # VOLUME /var/lib/postgresql, so the mount belongs on the parent dir.
      # (On postgres:17 and older this must be /var/lib/postgresql/data.)
      - pgdata:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-mydb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: ng-redis
    restart: unless-stopped
    # Required: an unauthenticated Redis on the compose network is reachable by
    # any other container joined to it, not just this stack's backend. Same
    # required-var pattern as SECRET_KEY/ADMIN_PASSWORD below — fail to start
    # rather than come up open.
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (openssl rand -hex 32)} --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: license_server
      dockerfile: Dockerfile
    container_name: license-server
    restart: unless-stopped
    # NOT published to the host any more. The License Server API is served over
    # HTTPS on :443 by the `front` nginx, which reaches this container on the
    # internal compose network. Publishing 8001 as well would keep an
    # unencrypted copy of the same API listening on the host.
    expose:
      - "8001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-mydb}
      # app/core/config.py reads REDIS_HOST/REDIS_PORT/REDIS_DB — there is no
      # REDIS_URL setting. Passing a URL here (as this file used to) left the
      # host at its "localhost" default, so the API could never reach Redis and
      # rate limiting silently degraded to "allow every request".
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (openssl rand -hex 32)}
      # Required: Settings() has no default for SECRET_KEY, so the API refuses
      # to import without it. Fail here, with a readable message, rather than in
      # a container restart loop.
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
      # The FIRST admin account, made at the first start (there is none yet);
      # it must change this password at first login. After that both are
      # unused: accounts are managed in the console (Users) or with
      # `docker compose exec backend python -m app.cli`.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # Admin sessions end after this much inactivity, and this long after
      # login at the latest; an account locks for ADMIN_LOCKOUT_MINUTES after
      # ADMIN_MAX_FAILED_LOGINS failed logins in a row.
      - ADMIN_IDLE_TIMEOUT_MINUTES=${ADMIN_IDLE_TIMEOUT_MINUTES:-15}
      - ADMIN_MAX_FAILED_LOGINS=${ADMIN_MAX_FAILED_LOGINS:-5}
      - ADMIN_LOCKOUT_MINUTES=${ADMIN_LOCKOUT_MINUTES:-15}
      # Admin login is gated by Cloudflare Turnstile. TURNSTILE_ENABLED=false turns
      # the check off for a host with no route to Cloudflare, so the secret is not a
      # ${VAR:?} requirement: with the default (true) an empty secret still rejects
      # every login (503 and an ERROR log), a clear failure rather than a skipped check.
      # The admin UI reads the flag at runtime (GET /api/admin/login-options), so
      # changing it needs `docker compose restart backend`, not a rebuild.
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-true}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      # Signs every licensing answer; NGCorion refuses unsigned ones, so start
      # nothing without it. Generate with license_server/scripts/generate_signing_key.py.
      - LICENSE_SIGNING_PRIVATE_KEY=${LICENSE_SIGNING_PRIVATE_KEY:?set LICENSE_SIGNING_PRIVATE_KEY in .env (python license_server/scripts/generate_signing_key.py)}
      # Empty by default: nginx (the `front` service) serves the admin UI and
      # proxies /api/ to this container on the same origin, so the browser
      # never makes a cross-origin call in the normal setup and this is a
      # no-op. Only needed if the built UI is ever hosted separately (see
      # VITE_LICENSE_API_URL) — set it in .env to that UI's origin(s) then.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-8}
      # Internal portal integration. Required, same fail-fast pattern as
      # SECRET_KEY: without it /internal/portal/* answers 503 on every call,
      # so refuse to start rather than come up with a dead integration.
      # Must differ from SECRET_KEY — see .env.example.
      - PORTAL_JWT_SECRET=${PORTAL_JWT_SECRET:?set PORTAL_JWT_SECRET in .env (openssl rand -hex 32), and make it different from SECRET_KEY}
      # Also the target for outbound license events
      # (POST $PORTAL_BASE_URL/internal/ls/license-events). Set it to an empty
      # string to keep the inbound endpoints while sending no events.
      - PORTAL_BASE_URL=${PORTAL_BASE_URL:-http://172.16.120.80}
      # Event delivery tuning. All optional — app/core/config.py has the
      # defaults (3 attempts, ~1s/~2s backoff, 5s timeout, 2 workers) and
      # .env.example documents them. Passed through so they can be tuned from
      # .env without a rebuild.
      - PORTAL_EVENT_MAX_ATTEMPTS=${PORTAL_EVENT_MAX_ATTEMPTS:-3}
      - PORTAL_EVENT_BACKOFF_BASE_SECONDS=${PORTAL_EVENT_BACKOFF_BASE_SECONDS:-1.0}
      - PORTAL_EVENT_TIMEOUT_SECONDS=${PORTAL_EVENT_TIMEOUT_SECONDS:-5.0}
      - PORTAL_EVENT_WORKERS=${PORTAL_EVENT_WORKERS:-2}
      - PORTAL_EVENT_QUEUE_MAXSIZE=${PORTAL_EVENT_QUEUE_MAXSIZE:-1000}
      # 0 disables the sweep that emits license.expired.
      - PORTAL_EXPIRY_SWEEP_INTERVAL_SECONDS=${PORTAL_EXPIRY_SWEEP_INTERVAL_SECONDS:-300}
      # Portal user/order cache sync. 0 disables the periodic pull and leaves
      # POST /api/admin/portal/sync as the only trigger.
      - PORTAL_SYNC_INTERVAL_SECONDS=${PORTAL_SYNC_INTERVAL_SECONDS:-900}
      - PORTAL_SYNC_PAGE_SIZE=${PORTAL_SYNC_PAGE_SIZE:-50}
      - PORTAL_SYNC_MAX_PAGES=${PORTAL_SYNC_MAX_PAGES:-200}
      - PORTAL_SYNC_TIMEOUT_SECONDS=${PORTAL_SYNC_TIMEOUT_SECONDS:-15.0}
      # Empty default fails closed (no caller allowed). The `allow` line in
      # license-admin-ui/nginx.conf is the primary gate and must be kept in
      # step with this by hand.
      - PORTAL_IP_WHITELIST=${PORTAL_IP_WHITELIST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      # The image has no curl/wget; python is guaranteed to be there.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  front:
    build:
      context: license-admin-ui
      dockerfile: Dockerfile.prod
    container_name: ng-frontend
    restart: unless-stopped
    ports:
      # Plain HTTP: the primary entry point. The domain manager terminates TLS
      # for the public name and forwards here, so this port serves the whole
      # application (SPA, /api, /internal, /health) — see nginx.conf.
      - "${FRONTEND_PORT:-80}:80"
      # HTTPS: kept for direct local/internal access by IP, bypassing the domain
      # manager. No longer the primary address.
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Self-signed cert + key, generated by ./scripts/gen-self-signed-cert.sh.
      # Mounted read-only rather than baked into the image so the private key
      # stays out of every image layer.
      #
      # Long syntax, one file each, create_host_path: false. The short form
      # (./certs:/etc/nginx/certs) makes docker silently create a missing ./certs
      # as an EMPTY root-owned directory: nginx then crash-loops on the missing
      # cert, and the script can no longer write into that directory as a normal
      # user. With these, `docker compose up` stops immediately with
      # "bind source path does not exist: .../certs/license-server.crt".
      #
      # After rotating the cert, recreate the container
      # (docker compose up -d --force-recreate front) so nginx loads the new pair.
      - type: bind
        source: ./certs/license-server.crt
        target: /etc/nginx/certs/license-server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./certs/license-server.key
        target: /etc/nginx/certs/license-server.key
        read_only: true
        bind:
          create_host_path: false
      # The repo's nginx.conf, mounted over the copy baked in by Dockerfile.prod,
      # so a config change needs a container restart rather than an image rebuild.
      # A single-file bind mount pins the file's inode, and `git pull` replaces
      # files with new inodes: after pulling, recreate the container
      # (docker compose up -d --force-recreate front) or nginx keeps the old config.
      - ./license-admin-ui/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        # nginx resolves `license-server` when it starts and fails hard with
        # "host not found in upstream" if the backend is not up yet, so wait for
        # healthy rather than merely started.
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      # Probes port 80, the listener the domain manager forwards to — the path
      # that must work for anything outside this host. The 443 listener shares
      # the same server block, so a config error would break both alike; what
      # this no longer covers is the certificate itself (it used --cacert to
      # catch an expired or IP-SAN-less cert), so cert rotation is now only
      # caught by a client that actually connects over 443.
      #
      # GET /health, not `/`: `/` is the SPA's index.html, served by nginx
      # alone; /health goes through the proxy to license-server:8001. It must
      # be a GET — FastAPI registers /health for GET only, so a HEAD probe
      # (curl -I, wget --spider) gets 405 and fails a healthy stack.
      # /health is exempt from the rate limiter, so this burns no quota.
      test: ["CMD", "curl", "-fsS", "-X", "GET",
             "-o", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  app-network:
    driver: bridge
