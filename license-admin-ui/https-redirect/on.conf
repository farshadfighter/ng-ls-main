# HTTPS redirect on port 80: on. Turned on by scripts/enable-https-redirect.sh once
# https://lic.ngcorion.com answers with a valid, publicly trusted certificate (ACME.md).
# $ls_to_https (nginx.conf) limits it to plain-HTTP requests for lic.ngcorion.com on port 80,
# never /internal/ or /health. 308 keeps the method and body of a POST.
if ($ls_to_https) {
    return 308 https://lic.ngcorion.com$request_uri;
}
