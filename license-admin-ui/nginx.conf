# nginx config for the built admin UI (see Dockerfile.prod).
# Serves the SPA and proxies API calls to the license server container.
#
# TLS is terminated OUTSIDE this stack: the domain manager holds the
# certificate for the public name and forwards cleartext to us on port 80.
# That is why port 80 serves the full application and does NOT redirect to
# 443 — a redirect here would bounce the domain manager's already-decrypted
# request back out to a scheme it has just terminated, which either loops or
# breaks POSTs depending on how the forwarder follows redirects.
#
# The 443 listener below is kept for local and internal access (direct-by-IP
# clients that bypass the domain manager), but it is no longer the primary
# entry point. One server block answers both ports so the two paths cannot
# drift apart: a location added for HTTPS is automatically served on HTTP too.

server {
    # Cleartext from the domain manager, which has already done TLS. This is
    # the primary entry point.
    listen 80 default_server;

    # HTTPS for direct internal access. This host has no public subdomain of
    # its own (no ACME/public CA is possible), which is why the certificate is
    # self-signed with an IP SAN — generate it with
    # ./scripts/gen-self-signed-cert.sh before starting.
    #
    # nginx refuses to start if the cert/key below are missing, and that
    # failure takes the WHOLE server block down with it — including port 80,
    # which is now the primary listener. The fix is to generate them, never to
    # comment this listener out.
    listen 443 ssl default_server;

    # default_server and no server_name on purpose: this one block answers
    # every Host — the bare IP NGCorion uses, the public name the domain
    # manager forwards, and every other domain alike. Do NOT add a
    # domain-specific server block without default_server here: requests whose
    # Host is the IP would then fall through to whichever block nginx picks
    # first, which is how a domain change silently breaks direct IP access.
    # A new domain needs only a SAN entry in the certificate (LICENSE_SERVER_DNS)
    # for the 443 path; the port 80 path needs nothing.

    ssl_certificate     /etc/nginx/certs/license-server.crt;
    ssl_certificate_key /etc/nginx/certs/license-server.key;

    # TLS 1.2 is the floor: the app server's license client talks through
    # python-requests/OpenSSL, which negotiates 1.3 here, and nothing older than
    # 1.2 has any client on this network.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Security response headers. `always` so they're sent on error responses
    # too (nginx otherwise only adds `add_header` on 2xx/3xx). Set at this
    # server level so every location below inherits them — nginx only drops
    # inherited add_header directives on a location that declares its own, and
    # none of the locations here do.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; frame-src 'self' https://challenges.cloudflare.com" always;
    # HSTS is sent on both listeners, but browsers ignore it on a plain-HTTP
    # response by spec. For clients arriving through the domain manager, HSTS
    # is therefore the domain manager's job now — it terminates the TLS the
    # browser sees and must add the header there for it to have any effect.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: deep links resolve in the browser, not on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin + license API. `license-server` resolves on the compose network.
    location /api/ {
        proxy_pass http://license-server:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # uvicorn runs with --proxy-headers and reads X-Forwarded-For. Without
        # this header every proxied request looks like it came from the nginx
        # container, so the per-IP rate limiter throttles all admin users
        # against one shared bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The scheme of THIS hop, which is http for requests the domain manager
        # forwards even though the browser used https. Nothing in the API
        # builds URLs from it, so it stays informational; if that changes, read
        # the client's X-Forwarded-Proto here instead of $scheme.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal portal integration (see license_server/app/routers/internal_portal.py).
    #
    # REQUIRED for the integration to work at all: without this block these
    # paths fall through to `location /` above and nginx answers the portal's
    # POST with 200 and the SPA's index.html, which the portal reads as a
    # successful license creation.
    #
    # This allow/deny is the PRIMARY enforcement of the IP whitelist, not a
    # duplicate of the app's check. The app's own check reads X-Real-IP, which
    # is only trustworthy because nginx overwrites it below and because the
    # backend's 8001 is never published to the host — see the long comment on
    # client_ip() in license_server/app/core/portal_auth.py. Keep both.
    #
    # The portal connects to us directly, not through the domain manager, so
    # $remote_addr is still the portal's own address on both listeners. If the
    # portal is ever moved behind the domain manager, every request will arrive
    # with the forwarder's address and `allow 172.16.120.80` will deny it —
    # the whitelist then has to name the forwarder, and the app-side check has
    # to trust a header from it.
    #
    # Hard-coded rather than templated from PORTAL_IP_WHITELIST: this file is
    # bind-mounted as-is (no envsubst in the image), so a variable here would
    # be a literal string that `allow` rejects at startup. When the whitelist
    # changes, both this block and PORTAL_IP_WHITELIST in .env must change.
    location /internal/ {
        allow 172.16.120.80;
        deny all;

        proxy_pass http://license-server:8001/internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for as the /api/ block uses.
        # The append form keeps whatever the client sent as the left-most
        # entry, and uvicorn runs with `--forwarded-allow-ips "*"`, which takes
        # the left-most entry as request.client.host. A caller sending
        # `X-Forwarded-For: 172.16.120.80` would hand itself the whitelisted
        # address. Overwriting drops the client's value entirely.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mirrors the Vite dev proxy, which forwards /health too (src/api/client.js
    # exposes serverHealth()). Without it this path would hit the SPA fallback.
    location /health {
        proxy_pass http://license-server:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
