# Let's Encrypt for lic.ngcorion.com: an override for docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.acme.yml up -d --build
#
# (or put COMPOSE_FILE=docker-compose.yml:docker-compose.acme.yml in .env and
# keep using plain `docker compose up -d`). Needs Docker Compose 2.24.4 or
# newer for the `!override` below. Full steps and checks: ACME.md.
#
# What changes compared with docker-compose.yml alone:
#   * Traefik takes host port 443. For lic.ngcorion.com it serves a Let's
#     Encrypt certificate it obtains and renews by itself; every other name
#     and the bare IP are passed through to nginx and still get the
#     self-signed certificate (traefik/dynamic.yml).
#   * nginx keeps host port 80 and stops publishing 443 (Traefik has it).
#   * Port 80 can send lic.ngcorion.com to HTTPS once the certificate is in
#     place: scripts/enable-https-redirect.sh (off until then).
#
# The certificate is obtained with the TLS-ALPN-01 challenge, which runs
# entirely on port 443. Port 80 is therefore left to nginx, unchanged, for
# the internal portal and everything else that uses it. Requirements: the DNS
# name points at this host, and port 443 is reachable from the internet
# (Let's Encrypt connects to it to validate). If the name is behind a proxying
# CDN, turn the proxying off for it (DNS only) - the CDN would answer the
# challenge instead of this host.

services:
  traefik:
    # Same Traefik release as NGCorion itself. Pinned to a minor version;
    # patch releases within it are picked up on the next `docker compose pull`.
    image: traefik:v3.7
    container_name: ng-traefik
    restart: unless-stopped
    command:
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=false
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env - Let's Encrypt sends expiry warnings there}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      # Production Let's Encrypt by default. For a dry run use the staging CA
      # (untrusted certificates, far higher rate limits):
      #   ACME_CA_SERVER=https://acme-staging-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # Health endpoint for the healthcheck below; not published.
      - --entrypoints.ping.address=:8082
      - --ping.entrypoint=ping
      - --log.level=INFO
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Static routing only: no Docker socket is mounted, so Traefik cannot see
      # or reach the Docker daemon.
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      # The account key and the certificate. Kept across restarts so the
      # certificate is not requested again on every start (Let's Encrypt
      # limits that to 5 per week for the same name).
      - acme:/acme
    depends_on:
      front:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--entrypoints.ping.address=:8082", "--ping.entrypoint=ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  front:
    # Host port 443 belongs to Traefik now; nginx keeps only port 80 and is
    # reached on 8081/8443 from Traefik over the compose network.
    ports: !override
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      # Port 80 -> HTTPS for lic.ngcorion.com: "off" until
      # scripts/enable-https-redirect.sh has checked the Let's Encrypt
      # certificate and set HTTPS_REDIRECT=on (ACME.md). Any other value has no
      # file and stops `docker compose up` with "bind source path does not exist".
      - type: bind
        source: ./license-admin-ui/https-redirect/${HTTPS_REDIRECT:-off}.conf
        target: /etc/nginx/https-redirect/redirect.conf
        read_only: true
        bind:
          create_host_path: false

volumes:
  acme:
    driver: local
